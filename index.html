<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Happy Birthday</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    font-family:Arial,Helvetica,sans-serif;
}


/* =====================================================
   GIRL SCREEN
===================================================== */

.scene{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;

    background-color:#fff3f5;

    background-image:
    linear-gradient(rgba(220,150,160,.13) 1px,transparent 1px),
    linear-gradient(90deg,rgba(220,150,160,.13) 1px,transparent 1px);

    background-size:18px 18px;
}


/* TOP DECOR */

.topDecor{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:150px;
    z-index:15;
}

.rope{
    position:absolute;
    left:-5%;
    top:18px;
    width:110%;
    height:60px;
    border-bottom:3px solid #d4576b;
    border-radius:0 0 50% 50%;
}

.flag{
    position:absolute;
    top:20px;
    width:0;
    height:0;

    border-left:9px solid transparent;
    border-right:9px solid transparent;
    border-top:22px solid #ed6177;
}

.flag:nth-child(even){
    border-top-color:#ffd34d;
}


/* RIBBONS */

.ribbon{
    position:absolute;
    top:0;
    width:9px;
    height:75px;
    border-radius:0 0 8px 8px;

    animation:ribbonSwing 3s ease-in-out infinite;
}

.ribbon:after{
    content:"";
    position:absolute;
    bottom:-16px;
    left:-8px;

    width:25px;
    height:25px;

    border-radius:50%;
    border-bottom:6px solid currentColor;

    transform:rotate(20deg);
}

.r1{
    left:5%;
    background:#ef6278;
    color:#ef6278;
}

.r2{
    left:17%;
    background:#ffd447;
    color:#ffd447;
    height:95px;
    animation-delay:.5s;
}

.r3{
    left:30%;
    background:#82c7e9;
    color:#82c7e9;
    height:70px;
    animation-delay:1s;
}

.r4{
    left:45%;
    background:#ed5c76;
    color:#ed5c76;
    height:100px;
    animation-delay:.3s;
}

.r5{
    left:61%;
    background:#ffd447;
    color:#ffd447;
    height:80px;
    animation-delay:1.3s;
}

.r6{
    left:76%;
    background:#8dc9e8;
    color:#8dc9e8;
    height:100px;
    animation-delay:.7s;
}

.r7{
    left:91%;
    background:#ee6378;
    color:#ee6378;
    height:70px;
    animation-delay:1.5s;
}


/* TITLE */

.title{
    position:absolute;
    left:4%;
    top:18%;
    z-index:25;

    opacity:0;

    animation:titleIn 1s ease forwards;
    animation-delay:1s;
}

.title h1{
    font-size:clamp(50px,15vw,100px);
    line-height:.78;

    font-weight:1000;
    letter-spacing:-4px;

    color:white;

    -webkit-text-stroke:3px #292929;

    text-shadow:
    4px 4px 0 #292929,
    8px 8px 0 #ed5d75,
    11px 11px 0 rgba(0,0,0,.12);
}

.title .birthday{
    color:#ef6178;
    -webkit-text-stroke:3px #292929;
}


/* PARTY HAT */

.partyHat{
    position:absolute;

    width:42px;
    height:47px;

    left:155px;
    top:-40px;

    background:linear-gradient(
        130deg,
        #ef6178,
        #ff8798
    );

    clip-path:polygon(
        50% 0,
        100% 100%,
        0 100%
    );

    transform:rotate(17deg);
    z-index:5;
}

.partyHat:before{
    content:"";

    position:absolute;

    width:9px;
    height:9px;

    border-radius:50%;

    background:#ffd84a;

    left:14px;
    top:15px;
}

.partyHat:after{
    content:"";

    position:absolute;

    width:8px;
    height:8px;

    border-radius:50%;

    background:white;

    left:25px;
    top:27px;
}


/* OPEN BUTTON */

.openButton{
    position:absolute;

    left:6%;
    top:51%;

    z-index:50;

    width:180px;
    height:55px;

    border:3px solid #b83e53;
    border-radius:30px;

    background:
    linear-gradient(
        #f9798c,
        #e85269
    );

    color:white;

    font-size:18px;
    font-weight:900;

    letter-spacing:1px;

    box-shadow:
    0 6px 0 #a43b4e,
    0 10px 20px rgba(150,50,70,.2);

    cursor:pointer;

    opacity:0;

    animation:buttonIn .8s ease forwards;
    animation-delay:2.5s;
}

.openButton:active{
    transform:translateY(5px);
}


/* =====================================================
   GIRL
===================================================== */

.girl{
    position:absolute;

    right:2%;
    top:19%;

    width:min(49vw,320px);
    height:min(69vw,410px);

    z-index:30;

    opacity:0;

    animation:
    girlIn 1.4s cubic-bezier(.2,.8,.2,1)
    1.8s forwards;
}

.hairBack{
    position:absolute;
    left:5%;
    top:0;

    width:90%;
    height:78%;

    background:
    linear-gradient(
        110deg,
        #3c2119,
        #75452e,
        #4a281e
    );

    border-radius:
    50% 50% 44% 44%;

    box-shadow:
    inset 8px 0 rgba(255,255,255,.08),
    inset -13px 0 rgba(0,0,0,.2);
}

.hairShine{
    position:absolute;
    left:16%;
    top:11%;

    width:20%;
    height:48%;

    border-left:
    6px solid rgba(255,255,255,.1);

    border-radius:50%;

    transform:rotate(12deg);
    z-index:3;
}

.face{
    position:absolute;
    left:23%;
    top:13%;

    width:54%;
    height:48%;

    background:
    linear-gradient(
        130deg,
        #ffd5b6,
        #edb28f
    );

    border-radius:
    49% 49% 46% 46%;

    z-index:8;

    box-shadow:
    inset -5px -6px 10px
    rgba(130,70,50,.08);
}

.ear{
    position:absolute;

    width:20px;
    height:31px;

    top:38%;

    background:#efb591;
    border-radius:50%;
    z-index:6;
}

.ear.left{left:-12px;}
.ear.right{right:-12px;}

.fringe{
    position:absolute;

    left:-5%;
    top:-4%;

    width:110%;
    height:35%;

    background:
    linear-gradient(
        100deg,
        #42251c,
        #70422c,
        #43251c
    );

    border-radius:
    55% 55% 35% 35%;

    z-index:12;
}

.lock{
    position:absolute;

    width:27px;
    height:110px;

    top:20%;

    background:#502d21;
    border-radius:50%;
    z-index:13;
}

.lock.left{
    left:8%;
    transform:rotate(8deg);
}

.lock.right{
    right:8%;
    transform:rotate(-8deg);
}

.brow{
    position:absolute;

    top:38%;
    width:21px;
    height:4px;

    background:#45271f;
    border-radius:10px;
    z-index:14;
}

.brow.left{
    left:26%;
    transform:rotate(8deg);
}

.brow.right{
    right:26%;
    transform:rotate(-8deg);
}

.eye{
    position:absolute;

    top:44%;

    width:12px;
    height:16px;

    background:#261c19;
    border-radius:50%;
    z-index:15;
}

.eye.left{left:28%;}
.eye.right{right:28%;}

.eye:before{
    content:"";

    position:absolute;

    width:4px;
    height:4px;

    background:white;
    border-radius:50%;

    left:3px;
    top:2px;
}

.lash{
    position:absolute;

    width:18px;
    height:6px;

    border-top:
    2px solid #37231e;

    z-index:16;
}

.lash.left{
    left:24%;
    top:42%;
    transform:rotate(-9deg);
}

.lash.right{
    right:24%;
    top:42%;
    transform:rotate(9deg);
}

.blush{
    position:absolute;

    width:25px;
    height:11px;

    background:
    rgba(239,95,115,.2);

    border-radius:50%;
    top:61%;
    z-index:14;
}

.blush.left{left:14%;}
.blush.right{right:14%;}

.nose{
    position:absolute;

    left:48%;
    top:55%;

    width:8px;
    height:12px;

    border-right:
    1px solid #b77c66;

    border-bottom:
    1px solid #b77c66;

    transform:rotate(14deg);
    z-index:16;
}

.mouth{
    position:absolute;

    left:38%;
    top:68%;

    width:30px;
    height:15px;

    border-bottom:
    3px solid #b64b5e;

    border-radius:
    0 0 50% 50%;

    z-index:17;
}

.neck{
    position:absolute;

    left:41%;
    top:58%;

    width:18%;
    height:15%;

    background:#efb491;
    z-index:5;
}

.body{
    position:absolute;

    left:12%;
    bottom:0;

    width:76%;
    height:41%;

    background:
    linear-gradient(
        100deg,
        #d94c64,
        #f16c80,
        #d94d63
    );

    border-radius:
    48% 48% 12% 12%;

    z-index:6;

    box-shadow:
    inset 0 9px rgba(255,255,255,.12);
}

.collar{
    position:absolute;

    left:33%;
    top:-5%;

    width:34%;
    height:26%;

    border-radius:50%;
    background:#f4c09e;
    z-index:7;
}

.dressLine{
    position:absolute;

    left:15%;
    right:15%;
    top:39%;

    height:4px;

    background:
    rgba(255,255,255,.28);

    z-index:8;
}


/* =====================================================
   GIFTS BESIDE GIRL
===================================================== */

.gifts{
    position:absolute;

    right:3%;
    bottom:5%;

    width:230px;
    height:150px;

    z-index:32;
}

.gift{
    position:absolute;

    border-radius:6px;

    box-shadow:
    0 8px 15px rgba(80,30,40,.18);

    animation:giftFloat 3s ease-in-out infinite;
}

.gift:before{
    content:"";

    position:absolute;

    left:45%;
    top:0;

    width:12%;
    height:100%;

    background:#ffd84d;
}

.gift:after{
    content:"";

    position:absolute;

    left:0;
    top:40%;

    width:100%;
    height:12%;

    background:#ffd84d;
}

.gift1{
    width:95px;
    height:72px;

    right:5px;
    bottom:4px;

    background:
    linear-gradient(135deg,#ee536d,#ff7187);

    animation-delay:.2s;
}

.gift2{
    width:75px;
    height:58px;

    left:18px;
    bottom:12px;

    background:
    linear-gradient(135deg,#79bde7,#a4d9f5);

    animation-delay:.8s;
}

.gift3{
    width:58px;
    height:48px;

    left:72px;
    bottom:70px;

    background:
    linear-gradient(135deg,#ffd24d,#ffe58b);

    animation-delay:1.2s;
}

.bow{
    position:absolute;

    left:39%;
    top:-18px;

    width:35px;
    height:25px;

    z-index:5;
}

.bow:before,
.bow:after{
    content:"";

    position:absolute;

    width:25px;
    height:20px;

    background:#ffd84d;

    border-radius:
    70% 20% 70% 20%;
}

.bow:before{
    left:-7px;
    transform:rotate(25deg);
}

.bow:after{
    right:-7px;
    transform:rotate(-25deg);
}

.giftLabel{
    position:absolute;

    left:8px;
    bottom:7px;

    color:white;

    font-size:10px;
    font-weight:bold;

    z-index:10;
}

@keyframes giftFloat{
    0%,100%{
        transform:translateY(0) rotate(0);
    }

    50%{
        transform:translateY(-5px) rotate(1deg);
    }
}


/* BALLOONS */

.flyingBalloon{
    position:absolute;

    bottom:-100px;

    width:35px;
    height:47px;

    border-radius:
    50% 50% 47% 47%;

    z-index:18;

    animation:
    balloonUp linear infinite;
}

.flyingBalloon:before{
    content:"";

    position:absolute;

    bottom:-4px;
    left:14px;

    width:8px;
    height:8px;

    background:inherit;
    transform:rotate(45deg);
}

.flyingBalloon:after{
    content:"";

    position:absolute;

    top:44px;
    left:50%;

    width:1px;
    height:120px;

    background:
    rgba(90,90,90,.4);
}

.balloonPink{
    left:7%;
    background:#f16a82;
    animation-duration:8s;
}

.balloonYellow{
    left:25%;
    background:#ffd452;
    animation-duration:10s;
    animation-delay:2s;
}

.balloonRed{
    left:45%;
    background:#e94f68;
    animation-duration:9s;
    animation-delay:4s;
}

.balloonBlue{
    left:67%;
    background:#79bde7;
    animation-duration:11s;
    animation-delay:1s;
}

.balloonPurple{
    left:87%;
    background:#b589dc;
    animation-duration:8.5s;
    animation-delay:3s;
}


/* CONFETTI */

.confetti{
    position:absolute;

    width:8px;
    height:8px;

    border-radius:50%;

    z-index:10;

    animation:
    confettiFloat 3s ease-in-out infinite;
}

.c1{
    left:5%;
    top:68%;
    background:#ef6379;
}

.c2{
    left:48%;
    top:72%;
    background:#ffd44a;
}

.c3{
    left:73%;
    top:64%;
    background:#7dbde3;
}

.c4{
    left:57%;
    top:25%;
    background:#ef6379;
}

.c5{
    left:88%;
    top:74%;
    background:#ffd44a;
}


/* =====================================================
   CARD
===================================================== */

.overlay{
    position:absolute;

    inset:0;

    z-index:100;

    background:
    rgba(0,0,0,.75);

    display:flex;

    align-items:center;
    justify-content:center;

    opacity:0;
    visibility:hidden;

    transition:.5s;
}

.overlay.show{
    opacity:1;
    visibility:visible;
}

.card{
    position:relative;

    width:min(88vw,550px);
    height:min(63vw,365px);

    transform:
    scale(.55)
    rotateX(15deg)
    rotateY(-20deg);

    transition:
    1s cubic-bezier(.2,.8,.2,1);

    filter:
    drop-shadow(
        0 25px 35px
        rgba(0,0,0,.5)
    );
}

.overlay.show .card{
    transform:
    scale(1)
    rotateX(0)
    rotateY(0);
}

.cardInside{
    position:absolute;

    inset:0;

    display:flex;

    overflow:hidden;

    border-radius:12px;

    background:
    linear-gradient(
        135deg,
        #f34f69,
        #fa7184
    );

    border:
    4px solid #fff0f2;
}

.cardInside:before{
    content:"♥  ✦  ♥  ✦  ♥";

    position:absolute;

    top:8px;
    left:0;

    width:100%;

    text-align:center;

    color:
    rgba(255,255,255,.5);

    font-size:15px;

    letter-spacing:8px;

    z-index:5;
}

.leftPage{
    width:50%;
    height:100%;

    padding:30px 12px;

    text-align:center;

    color:white;

    background:
    linear-gradient(
        145deg,
        #f34e68,
        #ec6076
    );

    border-right:
    5px solid rgba(255,255,255,.8);
}

.rightPage{
    width:50%;
    height:100%;

    padding:30px 14px;

    text-align:center;

    color:white;

    background:
    linear-gradient(
        145deg,
        #fa7083,
        #ed526b
    );
}

.cardPhoto{
    width:65px;
    height:65px;

    margin:
    0 auto 12px;

    border-radius:50%;

    background:
    radial-gradient(
        circle at 50% 36%,
        #f4c29f 0 20%,
        transparent 21%
    ),
    radial-gradient(
        circle at 50% 48%,
        #593326 0 38%,
        transparent 39%
    ),
    #e7c975;

    border:4px solid white;
}

.leftPage h2{
    font-size:
    clamp(21px,5vw,36px);

    line-height:.9;
    margin-bottom:14px;

    text-shadow:
    2px 2px #b73d54;
}

.rightPage h2{
    font-size:38px;
    margin-bottom:9px;
}

.leftPage p,
.rightPage p{
    font-size:
    clamp(9px,2.6vw,15px);

    line-height:1.5;
}


/* ENTER BUTTON */

.clickOn{
    margin-top:18px;

    width:125px;
    height:40px;

    border:none;

    border-radius:22px;

    background:
    linear-gradient(
        #ffd95a,
        #f4bc28
    );

    color:#8a4d00;

    font-size:15px;

    font-weight:900;

    letter-spacing:1px;

    box-shadow:
    0 4px 0 #c4931d,
    0 5px 15px
    rgba(0,0,0,.2);

    cursor:pointer;
}


/* CLOSE */

.close{
    position:absolute;

    right:-15px;
    top:-15px;

    width:39px;
    height:39px;

    border:0;

    border-radius:50%;

    background:white;

    color:#e9536b;

    font-size:23px;

    font-weight:bold;

    z-index:200;
}


/* =====================================================
   CAKE SCREEN
===================================================== */

.cakeScreen{
    position:fixed;

    inset:0;

    z-index:500;

    display:none;

    overflow:hidden;

    background:
    radial-gradient(
        circle at 50% 45%,
        #ffd5de 0%,
        #f99aae 38%,
        #ef6f88 100%
    );

    align-items:center;
    justify-content:center;
}

.cakeScreen.active{
    display:flex;

    animation:cakeScreenIn .8s ease forwards;
}

@keyframes cakeScreenIn{
    from{
        opacity:0;
    }

    to{
        opacity:1;
    }
}


/* CAKE TITLE */

.cakeTitle{
    position:absolute;

    top:7%;

    width:100%;

    text-align:center;

    color:white;

    font-size:
    clamp(28px,8vw,58px);

    font-weight:1000;

    letter-spacing:2px;

    text-shadow:
    3px 4px 0 #a93650,
    0 5px 20px rgba(120,30,50,.3);
}


/* CAKE AREA */

.cakeArea{
    position:absolute;

    left:50%;
    top:54%;

    transform:
    translate(-50%,-50%);

    width:min(92vw,600px);
    height:480px;
}


/* PLATE */

.plate{
    position:absolute;

    left:50%;
    bottom:32px;

    transform:translateX(-50%);

    width:88%;
    height:45px;

    background:
    linear-gradient(
        #fff,
        #e7d9dc
    );

    border-radius:50%;

    box-shadow:
    0 15px 25px
    rgba(100,30,50,.25);
}

.plate:after{
    content:"";

    position:absolute;

    left:8%;
    right:8%;
    top:9px;

    height:15px;

    border-radius:50%;

    background:
    rgba(220,80,110,.12);
}


/* CAKE */

.cake{
    position:absolute;

    left:50%;
    bottom:65px;

    transform:
    translateX(-50%);

    width:min(74vw,420px);
    height:290px;

    transition:.7s;
}


/* BOTTOM CAKE LAYER */

.layer{
    position:absolute;

    left:50%;

    transform:translateX(-50%);

    width:100%;

    border-radius:
    15px 15px 10px 10px;

    overflow:hidden;

    box-shadow:
    inset 0 -10px 15px rgba(60,15,10,.15),
    0 8px 12px rgba(70,20,30,.15);

    transition:.7s;
}

.layer1{
    bottom:0;
    height:92px;

    background:
    linear-gradient(
        180deg,
        #7d3e28,
        #542516
    );
}

.layer2{
    bottom:78px;
    height:75px;

    width:94%;

    background:
    linear-gradient(
        180deg,
        #9a5030,
        #65301d
    );
}

.layer3{
    bottom:140px;
    height:68px;

    width:88%;

    background:
    linear-gradient(
        180deg,
        #854128,
        #542316
    );
}

.layer4{
    bottom:196px;
    height:58px;

    width:82%;

    background:
    linear-gradient(
        180deg,
        #a65a37,
        #71331f
    );
}


/* SPONGE TEXTURE */

.layer:before{
    content:"";

    position:absolute;

    inset:0;

    background:
    radial-gradient(
        circle,
        rgba(255,220,190,.25) 0 2px,
        transparent 3px
    );

    background-size:17px 14px;

    opacity:.6;
}


/* CREAM BETWEEN */

.cream{
    position:absolute;

    left:50%;

    transform:translateX(-50%);

    height:18px;

    border-radius:50%;

    background:
    linear-gradient(
        #fff,
        #ffe9ed
    );

    z-index:10;

    box-shadow:
    0 2px 4px rgba(90,20,30,.15);
}

.cream1{
    bottom:72px;
    width:94%;
}

.cream2{
    bottom:134px;
    width:88%;
}

.cream3{
    bottom:190px;
    width:82%;
}


/* TOP FROSTING */

.frosting{
    position:absolute;

    left:50%;

    bottom:225px;

    transform:translateX(-50%);

    width:84%;

    height:48px;

    background:
    linear-gradient(
        180deg,
        #fff,
        #ffe8ed
    );

    border-radius:
    25px 25px 16px 16px;

    z-index:20;

    ),

    border-radius:
    50% 50% 55% 55%;

}

.strawberry:before{

.candle{

    height:85px;

    );

    7px 7px 4px 4px;

    height:14px;

    background:#30201d;

    border-radius:5px;
}


/* FLAME */

.flame{
    position:absolute;

    left:50%;

    top:-46px;

    transform:
    translateX(-50%)
    scale(0);

    width:28px;
    height:43px;

    background:
    radial-gradient(
        ellipse at 50% 70%,
        #fff 0 18%,
        #ffd52f 20% 48%,
        #ff7b21 50% 75%,
        #e93636 76%
    );

    border-radius:
    50% 50% 45% 45%;

    filter:
    drop-shadow(
        0 0 12px #ff8b20
    );

    transform-origin:
    bottom center;
}

.flame.on{
    animation:
    flameAppear .5s ease forwards,
    flameMove .14s ease-in-out infinite alternate .5s;
}

@keyframes flameAppear{
    from{

        scale(0);

        translateX(-50%)

<script>


/* =====================================================
   OPEN CARD
===================================================== */

function openCard(){

    document
    .getElementById("overlay")
    .classList.add("show");

}


/* =====================================================
   CLOSE CARD
===================================================== */

function closeCard(){

    document
    .getElementById("overlay")
    .classList.remove("show");

}


/* =====================================================
   ENTER → CAKE
===================================================== */

function enterCake(event){

    event.stopPropagation();

    const overlay =
    document.getElementById("overlay");

    const cakeScreen =
    document.getElementById("cakeScreen");


    /* close card */

    overlay.classList.remove("show");


    /* wait for card closing */

    setTimeout(()=>{

        cakeScreen.classList.add("active");

    },450);

}


/* =====================================================
   LIGHT CANDLE
===================================================== */

let candleLit=false;

function lightCandle(){

    if(candleLit) return;

    candleLit=true;


    const flame =
    document.getElementById("flame");

    const match =
    document.getElementById("match");


    /* light flame */

    flame.classList.add("on");


    /* move match away */

    setTimeout(()=>{

        match.classList.add("hidden");

    },250);


    /* fireworks */

    setTimeout(()=>{

        startCelebration();

    },650);


    /* replay button */

    setTimeout(()=>{

        document
        .getElementById("replay")
        .classList.add("show");

    },3000);

}


/* =====================================================
   FIREWORKS
===================================================== */

const canvas =
document.getElementById("fireworks");

const ctx =
canvas.getContext("2d");

let particles=[];


function resizeCanvas(){

    canvas.width =
    window.innerWidth;

    canvas.height =
    window.innerHeight;

}

resizeCanvas();

window.addEventListener(
"resize",
resizeCanvas
);


function createFirework(x,y){

    for(let i=0;i<70;i++){

        const angle =
        Math.random()*Math.PI*2;

        const speed =
        2+
        Math.random()*5;

        particles.push({

            x:x,
            y:y,

            vx:
            Math.cos(angle)*speed,

            vy:
            Math.sin(angle)*speed,

            life:1,

            size:
            2+
            Math.random()*4,

            hue:
            Math.random()*360

        });

    }

}


function startCelebration(){

    createFirework(
        window.innerWidth*.18,
        window.innerHeight*.38
    );

    createFirework(
        window.innerWidth*.82,
        window.innerHeight*.38
    );

    createFirework(
        window.innerWidth*.5,
        window.innerHeight*.25
    );

    animateFireworks();

}


function animateFireworks(){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    particles.forEach((p,index)=>{

        p.x+=p.vx;
        p.y+=p.vy;

        p.vy+=.035;

        p.life-=.012;


        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI*2
        );

        ctx.fillStyle=
        `hsla(${p.hue},100%,65%,${p.life})`;

        ctx.fill();


        if(p.life<=0){

            particles.splice(index,1);

        }

    });


    if(particles.length>0){

        requestAnimationFrame(
            animateFireworks
        );

    }

}


/* =====================================================
   ESC
===================================================== */

document.addEventListener(
"keydown",
function(e){

    if(e.key==="Escape"){

        closeCard();

    }

});


/* =====================================================
   OUTSIDE CARD CLICK
===================================================== */

document
.getElementById("overlay")
.addEventListener(
"click",
function(e){

    if(e.target===this){

        closeCard();

    }

});


</script>
